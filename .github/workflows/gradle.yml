name: Build and SonarQube SAST Scan

on:
  push:
    branches:
      - Dev
  pull_request:
    branches:
      - Dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
      - name: Checkout source code
        uses: actions/checkout@v4

      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      
     # Build Project
      - name: Build Project
        run: ./gradlew clean build

   # -----------------------------
    # Verify Build Output
    # -----------------------------
      - name: Verify JAR
        run: ls -lh build/libs/

    # -----------------------------
    # Build Docker Image
    # -----------------------------
      - name: Build Docker Image
        run: docker build -t sastpoc-app:latest .

    # -----------------------------
    # Trivy Image Scan
    # -----------------------------
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          scan-type: 'image'
          image-ref: 'sastpoc-app:latest'
          format: 'json'
          output: 'trivy-image-report.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true

    # -----------------------------
    # Upload Trivy Report
    # -----------------------------
      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivy-image-report.json
        
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=CWM
            -Dsonar.projectName=sastPoc
            -Dsonar.sources=.
            -Dsonar.java.binaries=build
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}


      
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      
      - name: Get SonarQube Quality Gate Details
        run: |
          echo "Fetching Quality Gate details..."

          # Validate report file
          if [ ! -f ".scannerwork/report-task.txt" ]; then
            echo "report-task.txt not found. Sonar scan failed."
            exit 1
          fi

          # Extract full task URL (IMPORTANT FIX)
          TASK_URL=$(grep ceTaskUrl .scannerwork/report-task.txt | cut -d '=' -f2-)
          echo "Task URL: $TASK_URL"

          if [[ -z "$TASK_URL" ]]; then
            echo "Failed to extract TASK_URL"
            exit 1
          fi

          # Wait for analysis to complete
          STATUS="PENDING"
          while [[ "$STATUS" == "PENDING" || "$STATUS" == "IN_PROGRESS" ]]; do
            RESPONSE=$(curl -s -u $SONAR_TOKEN: $TASK_URL)
            STATUS=$(echo "$RESPONSE" | jq -r '.task.status // "null"')
            echo "Current Status: $STATUS"

            if [[ "$STATUS" == "null" ]]; then
              echo "Invalid response from SonarQube:"
              echo "$RESPONSE"
              exit 1
            fi

            sleep 5
          done

          if [[ "$STATUS" != "SUCCESS" ]]; then
            echo "SonarQube analysis failed with status: $STATUS"
            exit 1
          fi

          # Extract analysisId
          ANALYSIS_ID=$(echo "$RESPONSE" | jq -r '.task.analysisId')

          if [[ -z "$ANALYSIS_ID" || "$ANALYSIS_ID" == "null" ]]; then
            echo "analysisId is null"
            exit 1
          fi

          echo "Analysis ID: $ANALYSIS_ID"

          # Fetch Quality Gate result
          QG_RESPONSE=$(curl -s -u $SONAR_TOKEN: "$SONAR_HOST_URL/api/qualitygates/project_status?analysisId=$ANALYSIS_ID")

          echo "Quality Gate Response:"
          echo "$QG_RESPONSE" | jq

          echo "---- FAILED CONDITIONS ----"
          echo "$QG_RESPONSE" | jq -r '
            .projectStatus.conditions[]?
            | select(.status=="ERROR")
            | "\(.metricKey): \(.actualValue) (Expected: \(.errorThreshold))"
          '
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      # Enforce Quality Gate (fail pipeline)
      - name: SonarQube Quality Gate Check
        uses: sonarsource/sonarqube-quality-gate-action@v1.1.0
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
